<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Face Sensor HUD Overlay</title>

    <!-- MediaPipe & Camera Utility via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <!-- Three.js untuk Rendering 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Element Video Utama (Disembunyikan, di-render via Canvas) */
        #webcam {
            display: none;
        }

        /* Output Canvas Overlay */
        #output-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Cermin Kamera */
            z-index: 1;
        }

        /* Canvas ThreeJS 3D Overlay */
        #three-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
            z-index: 2;
        }

        /* Bilah Hitam Sensor Atas (HUD Bar) */
        .hud-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 70%, rgba(0,0,0,0) 100%);
            border-bottom: 2px solid rgba(0, 255, 204, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
            text-shadow: 0 0 8px #00ffcc;
        }

        .hud-title {
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-status-dot {
            width: 12px;
            height: 12px;
            background-color: #ff0055;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0055;
            animation: pulse 1.2s infinite;
        }

        .hud-status-dot.active {
            background-color: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }

        .hud-metrics {
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
        }

        .metric-box {
            background: rgba(0, 255, 204, 0.08);
            border: 1px solid rgba(0, 255, 204, 0.3);
            padding: 5px 10px;
            border-radius: 4px;
        }

        /* Corner Frame HUD Overlay */
        .hud-frame {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid #00ffcc;
            z-index: 5;
            pointer-events: none;
            opacity: 0.7;
        }
        .top-left { top: 80px; left: 20px; border-right: none; border-bottom: none; }
        .top-right { top: 80px; right: 20px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div id="container">
        <!-- Bilah Hitam Sensor Atas (HUD) -->
        <div class="hud-top-bar">
            <div class="hud-title">
                <div class="hud-status-dot" id="status-dot"></div>
                <span id="status-text">SENSOR: SEARCHING TARGET...</span>
            </div>
            <div class="hud-metrics">
                <div class="metric-box">POS X: <span id="val-x">0.00</span></div>
                <div class="metric-box">POS Y: <span id="val-y">0.00</span></div>
                <div class="metric-box">POS Z: <span id="val-z">0.00</span></div>
                <div class="metric-box">CONF: <span id="val-conf">0%</span></div>
            </div>
        </div>

        <!-- Frame Sudut HUD -->
        <div class="hud-frame top-left"></div>
        <div class="hud-frame top-right"></div>
        <div class="hud-frame bottom-left"></div>
        <div class="hud-frame bottom-right"></div>

        <!-- Element Video & Canvas -->
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output-canvas"></canvas>
        <canvas id="three-canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        const valX = document.getElementById('val-x');
        const valY = document.getElementById('val-y');
        const valZ = document.getElementById('val-z');
        const valConf = document.getElementById('val-conf');

        // Setup Three.js Scene untuk Visual Efek 3D
        const threeCanvas = document.getElementById('three-canvas');
        const scene = new THREE.Scene();
        const camera3D = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera3D.position.z = 3;

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Buat 3D Box Target Tracker
        const boxGeometry = new THREE.BoxGeometry(0.8, 1.0, 0.8);
        const boxEdges = new THREE.EdgesGeometry(boxGeometry);
        const boxMaterial = new THREE.LineBasicMaterial({ color: 0x00ffcc, linewidth: 2 });
        const targetBox3D = new THREE.LineSegments(boxEdges, boxMaterial);
        targetBox3D.visible = false;
        scene.add(targetBox3D);

        // Penyesuaian Ukuran Layar Window
        function resize() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera3D.aspect = window.innerWidth / window.innerHeight;
            camera3D.updateProjectionMatrix();
        }
        window.addEventListener('resize', resize);
        resize();

        // Callback Hasil Pemrosesan MediaPipe FaceMesh
        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Render Kamera Asli ke Canvas Base
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // Status Active
                statusDot.classList.add('active');
                statusText.innerText = "SENSOR: TARGET LOCKED (FACE 3D)";

                // Update Nilai Koordinat HUD
                const noseTip = landmarks[1];
                valX.innerText = (noseTip.x * 100).toFixed(1);
                valY.innerText = (noseTip.y * 100).toFixed(1);
                valZ.innerText = (noseTip.z * 100).toFixed(2);
                valConf.innerText = "98.4%";

                // 1. Gambar Wireframe 3D Tessellation pada Canvas 2D Overlay
                drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELLATION, { color: '#00ffcc33', lineWidth: 1 });
                drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, { color: '#00ffcc', lineWidth: 2 });
                drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, { color: '#00ffcc', lineWidth: 2 });
                drawConnectors(canvasCtx, landmarks, FACEMESH_FACE_OVAL, { color: '#00ffcc', lineWidth: 2 });
                drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, { color: '#00ff66', lineWidth: 2 });

                // 2. Transposisi ke Posisi Box Target 3D Three.js
                targetBox3D.visible = true;
                const posX = (noseTip.x - 0.5) * 2.5;
                const posY = -(noseTip.y - 0.5) * 2.0;
                const posZ = -noseTip.z * 5;

                targetBox3D.position.set(posX, posY, posZ);
                targetBox3D.rotation.y += 0.02; // Putar perlahan efek box 3D
            } else {
                statusDot.classList.remove('active');
                statusText.innerText = "SENSOR: SEARCHING TARGET...";
                valX.innerText = "0.00";
                valY.innerText = "0.00";
                valZ.innerText = "0.00";
                valConf.innerText = "0%";
                targetBox3D.visible = false;
            }

            canvasCtx.restore();
            renderer.render(scene, camera3D);
        }

        // Inisialisasi MediaPipe FaceMesh
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        faceMesh.onResults(onResults);

        // Menjalankan Input Kamera Webcam
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start().catch((err) => {
            statusText.innerText = "CAMERA ERROR: IZINKAN AKSES KAMERA / GUNAKAN HTTPS";
            console.error(err);
        });
    </script>
</body>
</html>
